<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Max' Ratte" />
  <meta name="theme-color" content="#07090f" />
  <title>Max' Ratte</title>
  <meta name="description" content="3D-Stealth-Spiel fürs Handy: Red Bull leertrinken, Warhammer-Figuren klauen und vor Max in pinker Strumpfhose mit Eimer fliehen." />

  <!-- Link-Vorschau (WhatsApp, Telegram, iMessage, Signal, Discord …) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Max' Ratte" />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:url" content="https://simon23-12.github.io/maxratgame/" />
  <meta property="og:title" content="Max' Ratte 🐀 Schaffst du's raus, bevor Max dich mit dem Eimer erwischt?" />
  <meta property="og:description" content="3D-Stealth fürs Handy: Red Bull leertrinken, Warhammer-Figuren klauen, vor Max in pinker Strumpfhose fliehen. 3 Level, direkt im Browser." />
  <meta property="og:image" content="https://simon23-12.github.io/maxratgame/og-preview.jpg" />
  <meta property="og:image:secure_url" content="https://simon23-12.github.io/maxratgame/og-preview.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Eine Ratte flüchtet vor Max, der in pinker Strumpfhose mit einem Eimer hinter ihr her ist." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Max' Ratte 🐀" />
  <meta name="twitter:description" content="Schaffst du's raus, bevor Max dich mit dem Eimer erwischt?" />
  <meta name="twitter:image" content="https://simon23-12.github.io/maxratgame/og-preview.jpg" />

  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="loader">
    <div class="loader-title">Max' Ratte</div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div id="loader-text">lade Wohnung …</div>
  </div>

  <!-- HUD -->
  <div id="hud" hidden>
    <div class="top">
      <button id="pause" aria-label="Pause">❚❚</button>
      <div id="obj"><div id="obj-title"></div><div id="obj-count"></div><div id="timer"></div></div>
      <canvas id="radar" width="240" height="240"></canvas>
    </div>
    <div id="noise"><span class="lbl">Max</span><div class="meter"><div id="noise-fill"></div></div><span id="noise-face">😴</span></div>
    <div id="status"></div>
    <div id="toast"></div>
  </div>
  <button id="action" hidden><span id="action-ring"></span><span id="action-label">Aktion</span></button>
  <div id="stick" hidden><div id="knob"></div></div>

  <!-- Menue -->
  <div id="menu" class="overlay" hidden>
    <div class="panel">
      <div class="logo">MAX' <span>RATTE</span></div>
      <div class="sub">Eine Ratte. Eine Altbauwohnung. Ein Mann in pinker Strumpfhose.</div>
      <div id="level-list"></div>
      <button id="music-menu" class="music-btn">♪ Musik: an</button>
      <div class="foot">Am besten hochkant auf dem Handy · mit Ton</div>
    </div>
  </div>

  <!-- Codec-Briefing -->
  <div id="brief" class="overlay" hidden>
    <div class="panel codec">
      <div class="codec-head"><span>CODEC</span><span class="freq">140.85</span></div>
      <div id="brief-title"></div>
      <div id="brief-text"></div>
      <div id="brief-controls"></div>
      <button id="brief-go" class="primary">Los geht's</button>
    </div>
  </div>

  <div id="pause-menu" class="overlay" hidden>
    <div class="panel">
      <div class="logo small">Pause</div>
      <button id="pause-resume" class="primary">Weiter</button>
      <button id="pause-restart">Level neu starten</button>
      <button id="pause-menu-btn">Levelauswahl</button>
      <button id="music-pause" class="music-btn">♪ Musik: an</button>
    </div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="panel">
      <div id="result-title" class="logo small"></div>
      <div id="result-text"></div>
      <button id="result-next" class="primary">Nächstes Level</button>
      <button id="result-retry">Nochmal</button>
      <button id="result-menu">Levelauswahl</button>
    </div>
  </div>

  <div id="rotate">Bitte das Handy hochkant halten 📱</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
